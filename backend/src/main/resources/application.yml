# ============= Server Configuration =============
server:
  tomcat:
    connection-timeout: 120s
    keep-alive-timeout: 120s
    threads:
      max: 200
      min-spare: 10
  servlet:
    session:
      timeout: 30m

spring:
  # MVC Async Timeout
  mvc:
    async:
      request-timeout: 120s

  datasource:
    url: "jdbc:mysql://localhost:3306/gym_plan?createDatabaseIfNotExist=true"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 100ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "gymplan:"

# CORS Configuration
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
    exposed-headers: Authorization,Access-Control-Allow-Origin,Access-Control-Allow-Credentials
    allow-credentials: true
    max-age: 3600

# Logging Configuration
logging:
  level:
    # Redis cache operations (DEBUG for detailed logs)
    com.dev.backend.service.impl.RedisCacheServiceImpl: DEBUG
    # Spring Cache operations
    org.springframework.cache: DEBUG
    # Rate limiting
    com.dev.backend.security.RateLimitingFilter: DEBUG
    # Redis connection
    io.lettuce.core: INFO
    org.springframework.data.redis: DEBUG

# ============= Firebase Configuration =============
firebase:
  enabled: true
  credentials:
    path: firebase-service-account.json

# ============= Notification Scheduler =============
notification:
  scheduler:
    enabled: true
