spring.application.name=backend
#jwt
jwt.private.key=classpath:key.pem
jwt.public.key=classpath:certificate.pem

# JWT Token Expiration (in seconds)
jwt.access-token.expiration=900
jwt.refresh-token.expiration=604800

# ============= Firebase Configuration =============
firebase.enabled=false
firebase.credentials.path=firebase-service-account.json

notification.scheduler.enabled=true

spring.task.scheduling.pool.size=2

# ============= External API Configuration =============
# ExerciseDB API (RapidAPI)
exercisedb.api.base-url=https://exercisedb.p.rapidapi.com
exercisedb.api.key=${EXERCISEDB_API_KEY:}
exercisedb.api.host=exercisedb.p.rapidapi.com

# Edamam Meal Planner API
edamam.api.base-url=https://api.edamam.com
edamam.api.app-id=${EDAMAM_APP_ID:}
edamam.api.app-key=${EDAMAM_APP_KEY:}

# ============= Caching Configuration =============
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h
spring.cache.cache-names=exercises,recipes

# ============= OpenRouter Configuration =============
openrouter.api-key=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
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=arcee-ai/trinity-large-preview:free
openrouter.max-tokens=4000
openrouter.temperature=0.4
openrouter.timeout=120